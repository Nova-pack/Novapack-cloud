<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Preview — Albarán A4 (idéntico al de producción)</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;900&family=Outfit:wght@700;800;900&display=swap" rel="stylesheet">
<link rel="preload" href="/fonts/xenotron.woff2" as="font" type="font/woff2" crossorigin>
<style>
    @font-face {
        font-family: 'Xenotron';
        src: local('Xenotron'), url('/fonts/xenotron.woff2') format('woff2');
        font-display: block;
    }
</style>
<script src="libs/qrcode.min.js"></script>
<style>
    body { margin: 0; padding: 20px; background: #444; font-family: 'Inter', Arial, sans-serif; }
    .controls {
        max-width: 210mm; margin: 0 auto 16px;
        display: flex; flex-wrap: wrap; gap: 8px; align-items: center;
    }
    .controls button {
        background: #FF6600; color: #fff; border: 0; padding: 8px 14px;
        border-radius: 6px; cursor: pointer; font-weight: 700; font-size: 0.85rem;
    }
    .controls button.alt { background: #444; }
    .controls label { color: #ddd; font-size: 0.85rem; margin-left: 8px; }
    .controls #status { color: #FFB300; font-weight: 700; font-size: 0.85rem; }

    /* A4 = 210 × 297mm. Cada copia ocupa ~148mm. El ticket dentro tiene height fijo 132mm. */
    .page {
        width: 210mm; min-height: 297mm; margin: 0 auto 24px;
        background: white; box-shadow: 0 8px 24px rgba(0,0,0,0.4);
        display: flex; flex-direction: column;
    }
    .copy {
        flex: 1; padding: 8mm 10mm; display: flex; flex-direction: column;
        box-sizing: border-box;
    }
    .copy + .copy { border-top: 2px dashed #bbb; }

    .ruler {
        margin: 4px auto 0;
        max-width: 210mm;
        color: #999;
        font-size: 0.75rem;
        text-align: center;
    }

    @media print {
        body { background: white; padding: 0; }
        .controls, .ruler { display: none; }
        .page { box-shadow: none; margin: 0; page-break-after: always; }
    }
</style>
</head>
<body>

<div class="controls">
    <button onclick="window.print()">🖨️ Imprimir / Guardar PDF</button>
    <button class="alt" onclick="toggleData()">🔀 Pocos / muchos artículos</button>
    <button class="alt" onclick="togglePrealbaran()">📦 Pre-albarán</button>
    <button class="alt" onclick="togglePorte()">🔁 PAGADO / DEBIDO</button>
    <button class="alt" onclick="toggleWeights()">⚖️ Con / sin peso</button>
    <button class="alt" onclick="toggleExtreme()">💥 Caso extremo (15 items + notas largas)</button>
    <label>Estado:</label> <span id="status"></span>
</div>

<div class="page" id="page-1"></div>
<div class="ruler">Cada copia tiene <b>132mm</b> de alto fijo. Si el contenido se desborda → se recorta limpiamente (overflow:hidden).</div>

<script src="albaran_render.js?v=20260911_unificado"></script>
<script>
// Estado de simulación
var state = {
    manyArticles: false,
    prealbaran: false,
    porteDebido: true,
    withWeights: true,
    extreme: false
};

function esc(s) {
    return String(s == null ? '' : s)
        .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
        .replace(/"/g,'&quot;');
}
var escapeHtml = esc;  // (el renderizador compartido trae el suyo)  // alias para usar el mismo código que generateTicketHTML

// ========================================================
// COPIA EXACTA de generateTicketHTML de firebase-app.js
// (mantener sincronizado si se modifica producción)
// ========================================================
// Formato del albarán: FUENTE ÚNICA en albaran_render.js (cargado arriba).
var generateTicketHTML = window.npGenerateTicketHTML;
// ========================================================
// FIN copia exacta
// ========================================================

function _w(v) { return state.withWeights ? v : 0; }

function sampleTicket() {
    var packagesList;
    if (state.extreme) {
        packagesList = [
            { qty:5, size:'PAQUETE', weight:_w(5) },
            { qty:3, size:'BULTO',   weight:_w(8) },
            { qty:2, size:'PALET',   weight:_w(50) },
            { qty:4, size:'BI-200L', weight:_w(10) },
            { qty:1, size:'LUNA',    weight:_w(8) },
            { qty:2, size:'SOBRE',   weight:_w(1) },
            { qty:3, size:'BAT',     weight:_w(12) },
            { qty:1, size:'GV',      weight:_w(25) },
            { qty:2, size:'PLT-3',   weight:_w(35) },
            { qty:1, size:'PLT-7',   weight:_w(120) },
            { qty:6, size:'V',       weight:_w(8) },
            { qty:2, size:'PA',      weight:_w(2) },
            { qty:1, size:'AB',      weight:_w(15) },
            { qty:3, size:'LN',      weight:_w(4) },
            { qty:2, size:'LS',      weight:_w(6) }
        ];
    } else if (state.manyArticles) {
        packagesList = [
            { qty:3, size:'PAQUETE', weight:_w(5) },
            { qty:2, size:'PAQUETE', weight:_w(5) },
            { qty:3, size:'BULTO',   weight:_w(8) },
            { qty:2, size:'PALET',   weight:_w(50) },
            { qty:4, size:'BI-200L', weight:_w(10) },
            { qty:1, size:'LUNA',    weight:_w(8) },
            { qty:2, size:'SOBRE',   weight:_w(1) },
            { qty:3, size:'BAT',     weight:_w(12) }
        ];
    } else {
        packagesList = [
            { qty:3, size:'PAQUETE', weight:_w(5) },
            { qty:1, size:'BULTO',   weight:_w(12) },
            { qty:2, size:'PAQUETE', weight:_w(5) }
        ];
    }

    return {
        id: state.prealbaran ? 'PR-260515-AB12' : 'NP-26-1234',
        createdAt: new Date(),
        sender: 'AUTOCRISTAL SEVILLA',
        senderAddress: 'Polígono Industrial Z, Nave 12, 41008 Sevilla',
        senderPhone: '954 23 45 67',
        receiver: 'JUAN PÉREZ MARTÍNEZ',
        receiverNif: '12345678X',
        address: 'Calle Mayor 22',
        localidad: 'Córdoba',
        cp: '14012',
        phone: '666 78 90 12',
        province: 'Córdoba',
        clientIdNum: '1502',
        timeSlot: 'MAÑANA',
        cod: '150',
        notes: state.extreme
            ? 'Observación larga que se debería recortar limpiamente: llamar al timbre 3, no funciona el portero automático. Entregar mañana antes de las 12h. Cliente avisa cualquier cambio al móvil. Si no hay nadie dejarlo en portería del edificio.'
            : 'Llamar al timbre 3, portero estropeado.',
        packagesList: packagesList,
        compId: 'comp_sofia',
        compName: 'NOVAPACK Logística Sofía S.L.',
        compNif: 'B12345678',
        compEmail: 'admin@novapack.info',
        shippingType: state.porteDebido ? 'Debidos' : 'Pagados',
        paymentType: state.porteDebido ? 'DEBIDO' : 'PAGADO',
        portePagadoBy: state.porteDebido ? 'receiver' : 'sender',
        originType: state.prealbaran ? 'driver_pickup_no_doc' : 'normal',
        status: state.prealbaran ? 'pending_client_completion' : 'Pendiente'
    };
}

function render() {
    var t = sampleTicket();
    var page = document.getElementById('page-1');
    page.innerHTML =
        '<div class="copy">' + generateTicketHTML(t, 'Ejemplar para Administración') + '</div>' +
        '<div class="copy">' + generateTicketHTML(t, 'Ejemplar para el Cliente') + '</div>';

    var bits = [];
    if (state.extreme) bits.push('💥 15 items + notas largas (caso extremo)');
    else bits.push(state.manyArticles ? '8 items' : '3 items');
    bits.push(state.prealbaran ? 'PRE-ALBARÁN' : 'Normal');
    bits.push('Porte ' + (state.porteDebido ? 'DEBIDO' : 'PAGADO'));
    bits.push(state.withWeights ? 'Con peso' : 'Sin peso');
    document.getElementById('status').textContent = bits.join(' · ');
}

function toggleData()       { state.manyArticles = !state.manyArticles; state.extreme = false; render(); }
function togglePrealbaran() { state.prealbaran = !state.prealbaran; render(); }
function togglePorte()      { state.porteDebido = !state.porteDebido; render(); }
function toggleWeights()    { state.withWeights = !state.withWeights; render(); }
function toggleExtreme()    { state.extreme = !state.extreme; render(); }

render();
</script>

</body>
</html>
